<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bairoz VIP - Tarjeta de Puntos</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
      --accent: #6366f1;
      --accent-gold: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Buscador de ID */
    .search-box {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      gap: 10px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }

    input, button {
      outline: none;
      border: none;
      border-radius: 8px;
    }

    input {
      flex: 1;
      padding: 12px;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      border: 1px solid #334155;
    }

    button {
      padding: 12px 20px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }

    /* Tarjeta VIP */
    .vip-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      aspect-ratio: 1.586 / 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.3);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
    }

    .badge-tier {
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .card-number {
      font-family: monospace;
      font-size: 18px;
      letter-spacing: 3px;
      color: #cbd5e1;
      margin: 15px 0;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .field-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .field-value {
      font-size: 14px;
      font-weight: 600;
    }

    .cvv-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toggle-cvv {
      background: transparent;
      padding: 2px;
      cursor: pointer;
      font-size: 14px;
    }

    /* Panel de Puntos y Canje */
    .stats-panel {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .points-display {
      text-align: center;
      padding-bottom: 15px;
      border-bottom: 1px solid #334155;
    }

    .points-amount {
      font-size: 36px;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .redeem-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .loader {
      display: none;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Buscador -->
    <div class="search-box">
      <input type="text" id="clientIdInput" placeholder="Ingresá tu ID de Cliente">
      <button onclick="buscarCliente()">Buscar</button>
    </div>

    <!-- Indicador de Carga -->
    <div id="loader" class="loader">Consultando base de datos...</div>

    <!-- Tarjeta Virtual -->
    <div class="vip-card" id="cardContainer" style="opacity: 0.5;">
      <div class="card-header">
        <span class="brand-title">BAIROZ</span>
        <span class="badge-tier" id="cardType">VIP</span>
      </div>

      <div class="card-number" id="cardNumber">•••• •••• •••• ••••</div>

      <div class="card-footer">
        <div>
          <div class="field-label">Titular</div>
          <div class="field-value" id="cardHolder">Nombre del Cliente</div>
        </div>
        <div>
          <div class="field-label">CVV</div>
          <div class="cvv-container">
            <span class="field-value" id="cardCVV">•••</span>
            <button class="toggle-cvv" onclick="toggleCVV()">👁️</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Panel de Puntos -->
    <div class="stats-panel">
      <div class="points-display">
        <div class="field-label">Puntos Disponibles</div>
        <div class="points-amount" id="puntosDisponibles">0</div>
      </div>

      <div class="redeem-form">
        <input type="number" id="puntosCanje" placeholder="Puntos a canjear">
        <input type="text" id="detalleCanje" placeholder="Detalle del premio (ej: Sticker Pack)">
        <input type="password" id="cvvConfirm" placeholder="Confirmar CVV" maxlength="4">
        <button onclick="procesarCanje()" style="background: var(--accent-gold); color: #000;">Canjear Puntos</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxAtM2wj2VxOFmOYUOkTFBL377lPiCnBZwT6J8Jf22pT_Dk5FUiYetVobhwlWx0lmvB/exec";

    let clienteActual = null;
    let cvvVisible = false;

    // Detecta ID si viene de un link QR (?id=CL-001)
    window.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const idFromUrl = urlParams.get("id");
      if (idFromUrl) {
        document.getElementById("clientIdInput").value = idFromUrl;
        buscarCliente();
      }
    });

    async function buscarCliente() {
      const id = document.getElementById("clientIdInput").value.trim();
      if (!id) return alert("Ingresá un ID válido");

      mostrarCarga(true);
      try {
        const res = await fetch(`${API_URL}?action=getProfile&id=${encodeURIComponent(id)}`);
        const result = await res.json();

        if (result.status === "success") {
          clienteActual = result.data;
          actualizarInterfaz();
        } else {
          alert("Cliente no encontrado");
        }
      } catch (err) {
        alert("Error de conexión con la base de datos");
      } finally {
        mostrarCarga(false);
      }
    }

    function actualizarInterfaz() {
      document.getElementById("cardContainer").style.opacity = "1";
      document.getElementById("cardHolder").innerText = `${clienteActual.nombre} ${clienteActual.apellido}`;
      document.getElementById("cardNumber").innerText = clienteActual.numeroTarjeta || "4512 •••• •••• 8890";
      document.getElementById("cardType").innerText = clienteActual.tipoTarjeta || "VIP";
      document.getElementById("puntosDisponibles").innerText = clienteActual.puntosDisponibles;
      cvvVisible = false;
      document.getElementById("cardCVV").innerText = "•••";
    }

    function toggleCVV() {
      if (!clienteActual) return;
      cvvVisible = !cvvVisible;
      document.getElementById("cardCVV").innerText = cvvVisible ? clienteActual.cvv : "•••";
    }

    async function procesarCanje() {
      if (!clienteActual) return alert("Primero buscá un cliente");

      const puntos = document.getElementById("puntosCanje").value;
      const detalle = document.getElementById("detalleCanje").value;
      const cvv = document.getElementById("cvvConfirm").value;

      if (!puntos || !detalle || !cvv) return alert("Completá todos los campos para el canje");

      mostrarCarga(true);
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "canjear",
            id: clienteActual.id,
            cvv: cvv,
            puntos: puntos,
            detalle: detalle
          })
        });

        const result = await res.json();
        if (result.status === "success") {
          alert("¡Canje realizado con éxito!");
          buscarCliente();
        } else {
          alert(`Error: ${result.message}`);
        }
      } catch (err) {
        alert("Error al procesar el canje");
      } finally {
        mostrarCarga(false);
      }
    }

    function mostrarCarga(mostrar) {
      document.getElementById("loader").style.display = mostrar ? "block" : "none";
    }
  </script>
</body>
</html>
